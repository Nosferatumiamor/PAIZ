<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>WeightStream Chat</title>
  <style>
    :root {
      --bg: #1a1d23;
      --panel: #252a33;
      --border: #3a4250;
      --text: #e8ecf1;
      --muted: #9aa3b2;
      --accent: #5b9fd4;
      --warn: #e6a23c;
      --crit: #e05c5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 13px;
    }
    header .specs { color: var(--muted); flex: 1; min-width: 200px; }
    .meter {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 180px;
    }
    .bar {
      width: 100px;
      height: 8px;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }
    .bar.critical > span { background: var(--crit); }
    .bar.warn > span { background: var(--warn); }
    main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    #chatHistory {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: min(720px, 88%);
      padding: 10px 14px;
      border-radius: 14px;
      line-height: 1.55;
      font-size: 14px;
    }
    .msg .body {
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg .role {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      opacity: 0.75;
    }
    .msg.user {
      align-self: flex-end;
      background: #2a4d68;
      border-bottom-right-radius: 4px;
    }
    .msg.user .role { color: #b8d4ea; }
    .msg.assistant {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.assistant .role { color: var(--muted); }
    .msg.system {
      align-self: center;
      max-width: 100%;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }
    .msg.error {
      align-self: flex-start;
      border: 1px solid var(--crit);
      color: #ffb4b4;
      background: #2a1f1f;
    }
    .msg.pending .body { color: var(--muted); font-style: italic; }
    #console {
      height: 120px;
      border-top: 1px solid var(--border);
      background: #12151a;
      padding: 8px 12px;
      overflow-y: auto;
      font-family: Consolas, monospace;
      font-size: 12px;
      color: var(--muted);
    }
    footer {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    input[type="range"] { width: 120px; }
    select, button {
      background: #1e232b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
    }
    button { cursor: pointer; background: var(--accent); color: #111; font-weight: 600; border: none; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #prompt {
      width: 100%;
      min-height: 56px;
      resize: vertical;
      background: #1e232b;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font: inherit;
    }
    .row { display: flex; gap: 8px; align-items: flex-end; }
    .row button { height: 40px; padding: 0 18px; }
    #loadPanel {
      margin: 16px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }
    #loadPanel.ready { display: none; }
    #loadPanel.failed { border-color: var(--crit); }
    #modelMeter { flex: 1; min-width: 220px; max-width: 360px; }
    #modelMeter.hidden { display: none; }
    #loadBar {
      height: 10px;
      background: #111;
      border-radius: 5px;
      overflow: hidden;
      margin: 10px 0;
    }
    #loadBar > span {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.4s;
    }
    #loadMsg { color: var(--muted); font-size: 13px; }
    #loadPct { font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <header>
    <strong>WeightStream</strong>
    <div class="specs" id="specs">Détection matériel…</div>
    <div class="meter" id="modelMeter">
      <span>Modèle</span>
      <div class="bar" id="modelBar"><span></span></div>
      <span id="modelPct">0%</span>
    </div>
    <div class="meter">
      <span>RAM</span>
      <div class="bar" id="ramBar"><span></span></div>
      <span id="ramPct">—</span>
    </div>
    <div class="meter">
      <span>Cache WS</span>
      <div class="bar" id="wsBar"><span></span></div>
      <span id="wsPct">—</span>
    </div>
  </header>
  <main>
    <div id="loadPanel">
      <div><strong id="loadTitle">Chargement du modèle…</strong> <span id="loadPct">0%</span></div>
      <div id="loadBar"><span id="loadFill"></span></div>
      <div id="loadMsg">L’interface est ouverte — le modèle se charge en arrière-plan.</div>
    </div>
    <div id="chatHistory">
      <div class="msg system">Chargement du modèle…</div>
    </div>
    <div id="console"></div>
  </main>
  <footer>
    <div class="controls">
      <label>Garde-fou
        <select id="guardMode">
          <option value="auto" selected>Auto</option>
          <option value="manual">Manuel</option>
          <option value="off">Off</option>
        </select>
      </label>
      <label>Quota RAM <span id="allowVal">85</span>%
        <input type="range" id="allowance" min="20" max="100" value="85" />
      </label>
      <span id="pressure">pression: —</span>
      <label>Max tokens
        <input type="number" id="maxTokens" min="16" max="1024" value="256" style="width:72px" />
      </label>
    </div>
    <div class="row">
      <textarea id="prompt" placeholder="Ton message…"></textarea>
      <button id="send">Envoyer</button>
    </div>
  </footer>
  <script>
    const log = (msg) => {
      const c = document.getElementById('console');
      const t = new Date().toLocaleTimeString();
      c.textContent += `[${t}] ${msg}\n`;
      c.scrollTop = c.scrollHeight;
    };

    const chatEl = () => document.getElementById('chatHistory');

    const scrollChat = () => {
      const el = chatEl();
      el.scrollTop = el.scrollHeight;
    };

    const clearSystemPlaceholder = () => {
      chatEl().querySelectorAll('.msg.system').forEach((n) => n.remove());
    };

    const appendMessage = (role, text, opts = {}) => {
      if (role !== 'system') clearSystemPlaceholder();
      const div = document.createElement('div');
      div.className = 'msg ' + role + (opts.pending ? ' pending' : '');
      if (role === 'user' || role === 'assistant') {
        const head = document.createElement('div');
        head.className = 'role';
        head.textContent = role === 'user' ? 'Toi' : 'Assistant';
        div.appendChild(head);
      }
      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = text;
      div.appendChild(body);
      chatEl().appendChild(div);
      scrollChat();
      return div;
    };

    const setMessageBody = (el, text) => {
      el.querySelector('.body').textContent = text;
      scrollChat();
    };

    const setBar = (el, pct, pressure) => {
      const bar = el.querySelector('span');
      bar.style.width = Math.min(100, pct) + '%';
      el.classList.remove('warn', 'critical');
      if (pressure === 'hard' || pressure === 'critical') el.classList.add('critical');
      else if (pressure === 'soft') el.classList.add('warn');
    };

    let modelReady = false;

    const applyModelUi = (m) => {
      const pct = Math.round((m.progress || 0) * 100);
      const panel = document.getElementById('loadPanel');
      const send = document.getElementById('send');
      const prompt = document.getElementById('prompt');
      const modelMeter = document.getElementById('modelMeter');
      const failed = m.phase === 'failed';

      modelReady = m.ready === true && m.phase === 'ready';

      document.getElementById('loadPct').textContent = pct + '%';
      document.getElementById('loadFill').style.width = pct + '%';
      document.getElementById('loadMsg').textContent = m.message || '…';
      document.getElementById('modelPct').textContent = pct + '%';
      setBar(document.getElementById('modelBar'), pct, '');

      if (modelReady) {
        panel.classList.add('ready');
        modelMeter.classList.add('hidden');
        send.disabled = false;
        prompt.disabled = false;
        prompt.placeholder = 'Ton message…';
        if (!chatEl().querySelector('.msg.user, .msg.assistant, .msg[data-ready-msg]')) {
          clearSystemPlaceholder();
          const n = appendMessage('system', 'Modèle prêt — écris un message.');
          n.dataset.readyMsg = '1';
        }
      } else if (m.phase === 'infer') {
        panel.classList.remove('ready');
        modelMeter.classList.add('hidden');
        send.disabled = true;
        prompt.disabled = false;
        prompt.placeholder = 'Génération en cours — tu peux préparer le suivant…';
      } else if (failed) {
        panel.classList.remove('ready');
        panel.classList.add('failed');
        modelMeter.classList.remove('hidden');
        document.getElementById('loadTitle').textContent = 'Échec du chargement';
        send.disabled = true;
        prompt.disabled = true;
        prompt.placeholder = 'Chargement échoué';
      } else {
        panel.classList.remove('ready');
        panel.classList.remove('failed');
        modelMeter.classList.remove('hidden');
        send.disabled = true;
        prompt.disabled = true;
        prompt.placeholder = 'Chargement en cours…';
        document.getElementById('loadTitle').textContent = 'Chargement du modèle…';
      }
    };

    async function pollModel() {
      try {
        const r = await fetch('/api/model');
        const m = await r.json();
        applyModelUi(m);
      } catch (_) {
        applyModelUi({ ready: false, phase: 'loading', progress: 0, message: 'Connexion au serveur…' });
      }
    }

    async function loadSpecs() {
      try {
        const r = await fetch('/api/specs');
        const s = await r.json();
        document.getElementById('specs').textContent =
          `${s.cpu_name} · ${s.ram_total_gib|0} Go RAM · ${s.has_gpu ? s.gpu_name + ' ' + (s.vram_total_gib|0) + ' Go' : 'CPU'} · confort ~${s.comfort_gib|0} Go (×${s.multiplier.toFixed(1)})`;
        log(`Estimation: natif ~${s.native_gib|0} Go → streaming ~${s.comfort_gib|0} Go (stretch ~${s.stretch_gib|0} Go)`);
      } catch (e) {
        log('Erreur specs: ' + e);
      }
    }

    let lastLogCount = 0;
    async function pollLogs() {
      try {
        const r = await fetch('/api/logs');
        const j = await r.json();
        if (!j.lines || j.lines.length <= lastLogCount) return;
        for (let i = lastLogCount; i < j.lines.length; ++i) {
          log(j.lines[i]);
        }
        lastLogCount = j.lines.length;
      } catch (_) {}
    }

    async function pollStatus() {
      try {
        const r = await fetch('/api/status');
        const s = await r.json();
        document.getElementById('ramPct').textContent = s.ram_used_pct.toFixed(0) + '%';
        setBar(document.getElementById('ramBar'), s.ram_used_pct, s.pressure);
        const wsPct = s.ws_cache_cap_mib > 0 ? 100 * s.ws_cache_used_mib / s.ws_cache_cap_mib : 0;
        document.getElementById('wsPct').textContent = s.ws_cache_used_mib.toFixed(0) + '/' + s.ws_cache_cap_mib.toFixed(0) + ' MiB';
        setBar(document.getElementById('wsBar'), wsPct, s.pressure);
        document.getElementById('pressure').textContent = `phase ${s.phase} · ${s.pressure} · quota ${(s.allowance*100)|0}% · ${s.headroom_gib.toFixed(1)} Go libres`;
      } catch (_) {}
    }

    async function pushGuard() {
      const allowance = document.getElementById('allowance').value / 100;
      const mode = document.getElementById('guardMode').value;
      await fetch('/api/guard', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ allowance, mode })
      });
      log(`Garde-fou: ${mode}, quota ${(allowance*100)|0}%`);
    }

    document.getElementById('allowance').oninput = (e) => {
      document.getElementById('allowVal').textContent = e.target.value;
      pushGuard();
    };
    document.getElementById('guardMode').onchange = pushGuard;

    document.getElementById('send').onclick = async () => {
      const promptEl = document.getElementById('prompt');
      const prompt = promptEl.value.trim();
      if (!prompt) return;
      if (!modelReady) {
        appendMessage('system', 'Le modèle charge encore — patiente quelques minutes.');
        pollModel();
        return;
      }
      const btn = document.getElementById('send');
      promptEl.value = '';
      btn.disabled = true;
      promptEl.disabled = true;
      appendMessage('user', prompt);
      const pending = appendMessage('assistant', 'Réflexion…', { pending: true });
      log('Génération…');
      const nTokens = Math.max(16, Math.min(1024, parseInt(document.getElementById('maxTokens').value, 10) || 256));
      try {
        const r = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt, n: nTokens })
        });
        const j = await r.json();
        if (!r.ok) {
          pending.remove();
          if (j.loading) {
            appendMessage('system', j.error + ` (${Math.round((j.progress || 0) * 100)}%)`);
          } else {
            appendMessage('error', j.error || ('Erreur HTTP ' + r.status));
          }
          log(j.error || ('Erreur HTTP ' + r.status));
          return;
        }
        if (j.error) {
          pending.remove();
          appendMessage('error', j.error);
          log(j.error);
        } else {
          pending.classList.remove('pending');
          pending.querySelector('.role').textContent = 'Assistant';
          setMessageBody(pending, j.text);
          log(`OK — ${j.tokens} tokens, ${j.seconds.toFixed(1)} s`);
        }
      } catch (e) {
        pending.remove();
        appendMessage('error', 'Erreur réseau — le serveur répond-il encore ?');
        log('Erreur réseau: ' + e);
      } finally {
        pollModel();
      }
    };

    document.getElementById('prompt').onkeydown = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('send').click(); }
    };

    document.getElementById('send').disabled = true;
    document.getElementById('prompt').disabled = true;
    applyModelUi({ ready: false, phase: 'loading', progress: 0, message: 'Démarrage…' });

    loadSpecs();
    setInterval(pollStatus, 1000);
    setInterval(pollModel, 500);
    setInterval(pollLogs, 1500);
    pollStatus();
    pollModel();
    pollLogs();
  </script>
</body>
</html>
